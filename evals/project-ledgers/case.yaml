schema_version: "1.1"
name: project-rules-from-agents
expected_outcome: |
  交付一份真实、完整、可导入的项目级补充规则，覆盖：
  1. 扫描目标项目的 AGENTS.md、CONTRIBUTING.md 等文档，提取项目专属的治理约束与工程规范
  2. 明确区分硬规则（确定性拦截/确认）和建议规则（工程规范、工作流建议）
  3. 生成 5-8 条规则，每条都有完整的 source 出处（AGENTS.md 位置、行号、quote）或 null
  4. 硬规则中使用 `${SESSION_WORKSPACE}` 引用工作区路径，不硬编码绝对路径
  5. 在本地通过导入校验，至少 1-2 条硬规则各运行 1 个应命中和 1 个不应命中的模拟
  6. 明确与全局基线的分离（无重复 ID，不与已发布全局规则冲突）
  7. 编写项目边界报告，说明每条规则的依据、`${SESSION_WORKSPACE}` 展开验证、缺口说明
  
  不可包含：猜测的项目约定、无出处的需求、机密信息在 quote 里、硬编码的绝对路径（除非通用 glob 如 `/.git`）、`...` 占位符或 TODO。
